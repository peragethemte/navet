include /etc/nginx/snippets/navet-icloud-backend.conf;
# Same-origin relay to the local iCloud sidecar for production Docker nginx. njs authenticates
# callers; the sidecar owns the Apple ID, the CalDAV session and recurrence expansion, so this
# hop carries no iCloud logic of its own and no credentials ever reach njs.
location /__navet_icloud_proxy__/ {
  js_content navet_icloud_proxy.handle;
}
