# Same-origin Entur relay for production Docker nginx. njs authenticates callers and injects the
# required ET-Client-Name header before fetching; both upstream targets are fixed, so there is no
# user-supplied URL and no DNS-pinning transport hop is needed.
location /__navet_entur_proxy__/ {
  # Trip planning posts a GraphQL document. The handler caps it again before parsing.
  client_max_body_size 16k;
  js_content navet_entur_proxy.handle;
}
